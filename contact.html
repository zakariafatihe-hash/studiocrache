<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact StudioCrache</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="#" class="logo">StudioCrache</a>
            <nav class="nav">
                <a href="../index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle">🌙</button>
                <a href="checkout/payment.html" class="btn btn-outline">Checkout</a>
            </div>
        </div>
    </header>

    <section class="contact-section">
        <div class="container">
            <div class="contact-content">
                <div class="contact-image">
                    <div class="contact-img-placeholder" style="background: linear-gradient(135deg, #11998e 0%, #38bdf8 100%); height: 400px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem;">
                        📧
                    </div>
                </div>
                <div class="contact-form">
                    <h2>Get in Touch</h2>
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="Subject of your message">
                        </div>
                        <div class="form-group">
                            <label for="message">Message *</label>
                            <textarea id="message" rows="5" placeholder="Your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n-submit>Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <a href="../index.html" class="logo">StudioCrache</a>
                    <p>Professional digital assets marketplace</p>
                </div>
                <div class="footer-links">
                    <h4>Quick Links</h4>
                    <a href="../index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </div>
                <div class="footer-payment">
                    <h4>We Accept</h4>
                    <div class="payment-icons">
                        <img src="assets/img/card-visa.png" alt="Visa">
                        <img src="assets/img/card-mastercard.png" alt="Mastercard">
                        <img src="assets/img/paypal.png" alt="PayPal">
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 StudioCrache. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
