<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - StudioCrache</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="../index.html" class="logo">StudioCrache</a>
        </div>
    </header>

    <section class="checkout-section">
        <div class="container">
            <div class="checkout-container">
                <div class="checkout-header">
                    <h1>Secure Checkout</h1>
                    <div class="checkout-steps">
                        <span class="step active">1. Cart</span>
                        <span class="step">2. Payment</span>
                        <span class="step">3. Confirmation</span>
                    </div>
                </div>

                <div class="checkout-content">
                    <!-- Cart Summary -->
                    <div class="cart-summary" id="cartSummary">
                        <h2 data-i18n-title>Your Cart</h2>
                        <div class="cart-item" id="cartItem">
                            <!-- Loaded dynamically -->
                        </div>
                        <div class="cart-total">
                            <div class="total-row">
                                <span data-i18n-subtitle>Subtotal:</span>
                                <span id="subtotal">$0.00</span>
                            </div>
                            <div class="total-row">
                                <span data-i18n-tax>Tax:</span>
                                <span id="tax">$0.00</span>
                            </div>
                            <div class="total-row grand-total">
                                <span data-i18n-total>Total:</span>
                                <span id="total">$0.00</span>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Form -->
                    <div class="payment-form-container">
                        <div class="payment-form">
                            <h2 data-i18n-title2>Payment Method</h2>
                            <div class="payment-options">
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="paypal" checked data-i18n-paypal>
                                    <span>PayPal <img src="../assets/img/paypal.png" alt="PayPal" height="24"></span>
                                </label>
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="stripe" data-i18n-stripe>
                                    <span>Stripe Card</span>
                                </label>
                            </div>

                            <div class="form-group">
                                <label for="email" data-i18n-email>Email Address *</label>
                                <input type="email" id="email" required>
                            </div>

                            <button class="btn btn-primary pay-button" id="payButton" data-i18n-pay>
                                Complete Payment
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../js/main.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
