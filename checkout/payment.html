<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - StudioCrache</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="../index.html" class="logo">StudioCrache</a>
        </div>
    </header>

    <section class="checkout-section">
        <div class="container">
            <div class="checkout-container">
                <div class="checkout-header">
                    <h1>Secure Checkout</h1>
                    <div class="checkout-steps">
                        <span class="step active">1. Cart</span>
                        <span class="step">2. Payment</span>
                        <span class="step">3. Confirmation</span>
                    </div>
                </div>

                <div class="checkout-content">
                    <!-- Cart Summary -->
                    <div class="cart-summary" id="cartSummary">
                        <h2>Your Cart</h2>
                        <div class="cart-item" id="cartItem">
                            <!-- Loaded dynamically -->
                        </div>
                        <div class="cart-total">
                            <div class="total-row">
                                <span>Subtotal:</span>
                                <span id="subtotal">$0.00</span>
                            </div>
                            <div class="total-row">
                                <span>Tax:</span>
                                <span id="tax">$0.00</span>
                            </div>
                            <div class="total-row grand-total">
                                <span>Total:</span>
                                <span id="total">$0.00</span>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Form -->
                    <div class="payment-form-container">
                        <div class="payment-form">
                            <h2>Payment Method</h2>
                            <div class="payment-options">
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="stripe" checked>
                                    <span>Stripe <img src="../assets/img/card-logos.png" alt="Cards"></span>
                                </label>
                                <label class="payment-option">
                                    <input type="radio" name="payment" value="paypal">
                                    <span>PayPal</span>
                                </label>
                            </div>

                            <div class="form-group">
                                <label for="email">Email Address *</label>
                                <input type="email" id="email" required>
                            </div>

                            <button class="btn btn-primary pay-button" id="payButton">
                                Complete Payment
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../js/main.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
